# ─────────────────────────────────────────────────────────────────────────────
#  Development overrides – live reload for backend + both frontends. Use with:
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  backend:
    build:
      target: builder # use builder stage so we can mount source live
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --log-level debug
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      WORKERS: "1"
    volumes:
      - ./backend:/app # live-reload: mount source over the image copy
    ports:
      - "8000:8000"

  db:
    ports:
      - "5432:5432" # expose to host in dev

  redis:
    ports:
      - "6379:6379"

  web-frontend:
    build:
      target: deps # stop before the production build so we can run `next dev`
    command: npm run dev -- -p 3000
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ../web-frontend:/app # live-reload: mount source over the image copy
      - /app/node_modules # keep the container's node_modules (don't shadow with host)
      - /app/.next
    ports:
      - "3000:3000"

  mobile-frontend:
    build:
      target: deps
    command: npm run dev -- -p 3000
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ../mobile-frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
