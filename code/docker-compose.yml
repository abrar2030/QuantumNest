version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  QuantumNest Capital – Docker Compose
#  Services: db · redis · backend · blockchain · web-frontend · mobile-frontend
#
#  This file lives at code/docker-compose.yml. `backend` and `blockchain`
#  build from ./backend and ./blockchain (inside code/); `web-frontend` and
#  `mobile-frontend` build from ../web-frontend and ../mobile-frontend,
#  since those two live at the repo root, as siblings of code/ - not inside
#  it. Run compose commands from code/ (e.g. `cd code && docker compose up`).
#
#  `blockchain` runs a local Hardhat node (see ./blockchain) so the backend's
#  blockchain features work out of the box with `docker compose up`, with no
#  external RPC provider needed. Contracts aren't deployed to it
#  automatically on every boot (the node's state is ephemeral and wiping it
#  on every `docker compose up` would be surprising) - run the one-shot
#  `blockchain-deploy` job once the node is healthy:
#
#    docker compose up -d blockchain
#    docker compose --profile blockchain-deploy run --rm blockchain-deploy
#    docker compose up -d backend
#
#  Until that's run, blockchain endpoints that need a deployed contract
#  return a clear "not deployed" response rather than failing the whole
#  backend - see backend/app/services/blockchain_service.py.
# ─────────────────────────────────────────────────────────────────────────────

# NEXT_PUBLIC_* variables are inlined into each frontend's client bundle at
# *build* time (see web-frontend/Dockerfile and mobile-frontend/Dockerfile),
# so they must point to a URL reachable from the end user's browser, not the
# in-network service name. With BACKEND_PORT published to the host (below),
# http://localhost:8000 is correct for local/dev use; override for
# staging/production deployments where the backend has a public hostname.
x-frontend-build-args: &frontend-build-args
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
  API_SECRET_KEY: ${API_SECRET_KEY:?API_SECRET_KEY must be set}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-quantumnest}
  REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
  HOST: 0.0.0.0
  PORT: "8000"
  WORKERS: ${WORKERS:-2}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-false}
  # Points at the `blockchain` service (local Hardhat node) by default;
  # override to point at a real testnet/mainnet RPC provider instead.
  ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-http://blockchain:8545}
  POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://polygon-rpc.com}
  BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org}
  # Optional: a funded account's private key, needed only for endpoints
  # that send transactions (contract deployment, state-changing calls).
  # Read-only endpoints (balances, contract reads) work without it.
  PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
  # Matches the network name `blockchain-deploy` deploys to (see
  # blockchain/hardhat.config.js's `docker` network) - i.e. which
  # blockchain/deployments/<name>.json file to read contract addresses
  # from.
  BLOCKCHAIN_NETWORK: ${BLOCKCHAIN_NETWORK:-docker}
  BLOCKCHAIN_DEPLOYMENTS_DIR: /app/deployments

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quantumnest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # bind to localhost only
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-quantumnest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - qn_internal

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qn_internal

  # ── Blockchain (local Hardhat node) ─────────────────────────────────────────
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8545:8545" # bind to localhost only
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - >
          const http=require('http');
          const data=JSON.stringify({jsonrpc:"2.0",method:"eth_blockNumber",params:[],id:1});
          const req=http.request({host:'localhost',port:8545,method:'POST',
          headers:{'Content-Type':'application/json','Content-Length':Buffer.byteLength(data)}},
          res=>process.exit(res.statusCode===200?0:1));
          req.on('error',()=>process.exit(1));req.write(data);req.end();
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - qn_internal

  # ── Blockchain contract deployment (one-shot job) ───────────────────────────
  # Deploys the contracts in ./blockchain to the `blockchain` service and
  # writes their addresses/ABIs to a volume the backend reads from. Not run
  # automatically (the node's chain state is ephemeral, so this would
  # otherwise re-deploy - and hand out new addresses - on every restart).
  # Run manually once the node is up:
  #   docker compose --profile blockchain-deploy run --rm blockchain-deploy
  blockchain-deploy:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    command:
      ["npx", "hardhat", "run", "scripts/deploy.js", "--network", "docker"]
    environment:
      HARDHAT_NETWORK_RPC_URL: http://blockchain:8545
    depends_on:
      blockchain:
        condition: service_healthy
    volumes:
      - blockchain_deployments:/app/deployments
    restart: "no"
    networks:
      - qn_internal
    profiles:
      - blockchain-deploy

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      blockchain:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      - backend_models:/app/models
      - backend_logs:/app/logs
      - blockchain_deployments:/app/deployments:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - qn_internal
      - qn_public

  # ── Web Frontend (Next.js) ──────────────────────────────────────────────────
  web-frontend:
    build:
      context: ../web-frontend
      dockerfile: Dockerfile
      args:
        <<: *frontend-build-args
    restart: unless-stopped
    ports:
      - "${WEB_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - qn_public

  # ── Mobile Frontend (Next.js, PWA) ──────────────────────────────────────────
  mobile-frontend:
    build:
      context: ../mobile-frontend
      dockerfile: Dockerfile
      args:
        <<: *frontend-build-args
    restart: unless-stopped
    ports:
      - "${MOBILE_FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - qn_public

  # ── Database Migrations (one-shot job) ────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    command:
      [
        "python",
        "-c",
        "from app.db.database import init_db; init_db(); print('DB initialised')",
      ]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - qn_internal
    profiles:
      - migrate

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_models:
  backend_logs:
  blockchain_deployments:

networks:
  qn_internal:
    driver: bridge
    internal: true # no direct internet access for internal services
  qn_public:
    driver: bridge # backend + web-frontend + mobile-frontend are reachable from the outside
