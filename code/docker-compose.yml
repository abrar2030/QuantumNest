version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  QuantumNest Capital – Docker Compose
#  Services: db · redis · backend · web-frontend · mobile-frontend
#
#  This compose file was adapted from the original QuantumNest monorepo's
#  code/docker-compose.yml to work with the flattened backend / web-frontend /
#  mobile-frontend layout of this package. It adds the two frontend services
#  (absent from the upstream file) and wires them to the backend.
# ─────────────────────────────────────────────────────────────────────────────

# NEXT_PUBLIC_* variables are inlined into each frontend's client bundle at
# *build* time (see web-frontend/Dockerfile and mobile-frontend/Dockerfile),
# so they must point to a URL reachable from the end user's browser, not the
# in-network service name. With BACKEND_PORT published to the host (below),
# http://localhost:8000 is correct for local/dev use; override for
# staging/production deployments where the backend has a public hostname.
x-frontend-build-args: &frontend-build-args
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
  API_SECRET_KEY: ${API_SECRET_KEY:?API_SECRET_KEY must be set}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-quantumnest}
  REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
  HOST: 0.0.0.0
  PORT: "8000"
  WORKERS: ${WORKERS:-2}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-false}
  # Points at the app's own default (localhost:8545) unless overridden.
  # The optional Hardhat blockchain node from the full QuantumNest monorepo
  # is not part of this package — set ETHEREUM_RPC_URL if you run one
  # separately, or leave it unset to use the built-in default.
  ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-http://localhost:8545}

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quantumnest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # bind to localhost only
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-quantumnest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - qn_internal

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qn_internal

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_models:/app/models
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - qn_internal
      - qn_public

  # ── Web Frontend (Next.js) ──────────────────────────────────────────────────
  web-frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
      args:
        <<: *frontend-build-args
    restart: unless-stopped
    ports:
      - "${WEB_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - qn_public

  # ── Mobile Frontend (Next.js, PWA) ──────────────────────────────────────────
  mobile-frontend:
    build:
      context: ./mobile-frontend
      dockerfile: Dockerfile
      args:
        <<: *frontend-build-args
    restart: unless-stopped
    ports:
      - "${MOBILE_FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - qn_public

  # ── Database Migrations (one-shot job) ────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    command:
      [
        "python",
        "-c",
        "from app.db.database import init_db; init_db(); print('DB initialised')",
      ]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - qn_internal
    profiles:
      - migrate

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_models:
  backend_logs:

networks:
  qn_internal:
    driver: bridge
    internal: true # no direct internet access for internal services
  qn_public:
    driver: bridge # backend + web-frontend + mobile-frontend are reachable from the outside
