apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quantumnest-dev

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: quantumnest-ingress
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - dev.quantumnest.com
          - dev-m.quantumnest.com
      - op: replace
        path: /spec/rules/0/host
        value: dev.quantumnest.com
      - op: replace
        path: /spec/rules/1/host
        value: dev-m.quantumnest.com
  - target:
      kind: ConfigMap
      name: quantumnest-backend-config
    patch: |-
      - op: replace
        path: /data/ALLOWED_ORIGINS
        value: "https://dev.quantumnest.com,https://dev-m.quantumnest.com"

replicas:
  - name: quantumnest-backend
    count: 1
  - name: quantumnest-web-frontend
    count: 1
  - name: quantumnest-mobile-frontend
    count: 1

images:
  - name: quantumnest/backend
    newTag: dev
  - name: quantumnest/web-frontend
    newTag: dev
  - name: quantumnest/mobile-frontend
    newTag: dev

commonLabels:
  environment: dev
