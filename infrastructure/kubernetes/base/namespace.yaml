apiVersion: v1
kind: Namespace
metadata:
  name: quantumnest-prod
  labels:
    name: quantumnest-prod
    environment: production
    compliance: pci-dss-sox-gdpr
    # NOTE: enforcement is "baseline", not "restricted". The backend's
    # istio-proxy sidecar (see backend-deployment.yaml) requires the
    # NET_ADMIN and NET_RAW capabilities to intercept traffic; the
    # "restricted" profile only permits adding back NET_BIND_SERVICE, so it
    # would reject this namespace's own backend deployment at admission
    # time. Switch to Istio's CNI plugin (which redirects traffic at the
    # node level instead of the sidecar) if "restricted" is required.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: quantumnest-staging
  labels:
    name: quantumnest-staging
    environment: staging
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: quantumnest-dev
  labels:
    name: quantumnest-dev
    environment: development
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: restricted
