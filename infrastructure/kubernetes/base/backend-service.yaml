apiVersion: v1
kind: Service
metadata:
  name: quantumnest-backend
  namespace: quantumnest-prod
  labels:
    app: quantumnest-backend
    tier: backend
    app.kubernetes.io/name: quantumnest-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: quantumnest-platform
  annotations:
    # prometheus-client is a declared dependency but no /metrics route is
    # implemented yet, so scraping is disabled until that's added.
    prometheus.io/scrape: "false"
spec:
  type: ClusterIP
  selector:
    app: quantumnest-backend
    tier: backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  sessionAffinity: None
