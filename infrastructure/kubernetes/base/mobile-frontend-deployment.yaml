apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumnest-mobile-frontend
  namespace: quantumnest-prod
  labels:
    app: quantumnest-mobile-frontend
    tier: frontend
    app.kubernetes.io/name: quantumnest-mobile-frontend
    app.kubernetes.io/component: mobile-frontend
    app.kubernetes.io/part-of: quantumnest-platform
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: quantumnest-mobile-frontend
  template:
    metadata:
      labels:
        app: quantumnest-mobile-frontend
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - quantumnest-mobile-frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: quantumnest-mobile-frontend
          # Built from mobile-frontend/Dockerfile. NEXT_PUBLIC_API_URL is
          # inlined into the client bundle at build time (Next.js convention)
          # so it must be set via `docker build --build-arg
          # NEXT_PUBLIC_API_URL=...` in the image pipeline for each
          # environment - setting it as a pod env var here would have no
          # effect on an already-built image.
          image: quantumnest/mobile-frontend:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
          env:
            - name: NODE_ENV
              value: "production"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      imagePullSecrets:
        - name: quantumnest-registry-secret
      terminationGracePeriodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quantumnest-mobile-frontend-pdb
  namespace: quantumnest-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: quantumnest-mobile-frontend
